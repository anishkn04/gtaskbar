[package]
name = "gtaskbar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A native, tray-first Google Tasks client for Linux built with GTK4 and libadwaita"
license = "MIT"
repository = "https://github.com/anishkn04/gtaskbar"
homepage = "https://github.com/anishkn04/gtaskbar"
readme = "README.md"
keywords = ["google-tasks", "gtk4", "libadwaita", "todo", "linux"]
categories = ["gui", "productivity"]

[package.metadata.deb]
fullname = "GTaskbar"

[dependencies]
# No version feature is enabled: gdk4-sys would then require that GTK version at
# build time, which is stricter than the app actually needs. The only 4.4+ API in
# use is MenuButton's `primary`, which is set via the `primary` property instead
# of the builder method, so the crate feature is unnecessary. This keeps the
# build working on distributions still shipping GTK 4.14, such as Ubuntu 24.04.
gtk = { package = "gtk4", version = "0.11" }
glue = "0.1"
gdk = { package = "gdk4", version = "0.11" }
# Feature gates are the app's real minimum, not the newest the crates support.
# libadwaita 1.5 is what brings AdwPreferencesDialog and AdwAboutDialog; every
# other widget in use (NavigationSplitView, NavigationPage, SpinRow, SwitchRow,
# Toast, ToolbarView) landed by 1.4. Declaring v1_9 instead would refuse to
# build on Ubuntu 24.04, which ships 1.5.
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
glib = "0.22"
gio = "0.22"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dirs = "7"
toml = "1"

rusqlite = { version = "0.40", features = ["bundled", "chrono"] }

tokio = { version = "1", features = ["rt", "sync"] }
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "query",
    "form",
    "rustls",
    "http2",
    "gzip",
] }
# 4.4 is the last release with the documented BasicClient/EmptyExtraTokenParams
# API. 5.0 redesigned the client's type parameters around EndpointState markers,
# which is more machinery than a four-call token exchange needs.
oauth2 = { version = "4.4", default-features = false, features = [
    "reqwest",
    "rustls-tls",
    "pkce-plain",
] }
keyring = "4"
base64 = "0.23"
url = "2"
sha2 = "0.11"

chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
codegen-units = 1
# Deliberately not panic = "abort". A background thread panicking used to kill
# the whole process, which for a tray app means an OAuth flow would take down the
# window, the tray icon and the loopback listener the browser was about to call
# back into, turning a recoverable error into ERR_CONNECTION_REFUSED. Unwinding
# confines a failure to the thread that caused it, so the button can report the
# error and the user can retry.
