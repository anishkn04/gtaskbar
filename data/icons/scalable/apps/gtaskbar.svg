  Glyph: Material Symbols "checklist" (outlined, 24px), taken verbatim from
  Google's official material-design-icons repository:

    symbols/web/checklist/materialsymbolsoutlined/checklist_24px.svg
    https://github.com/google/material-design-icons

  Licensed under the Apache License 2.0; a copy is at
  data/icons/upstream/LICENSE-Apache-2.0.txt and the unmodified upstream file is
  at data/icons/upstream/material-symbols-checklist-24px.svg.

  The upstream file declares viewBox="0 -960 960 960" with a 24px size. The only
  change here is the viewBox, re-centred onto a 128px artboard so the icon fills
  a launcher slot properly. The path data is unmodified.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Inset the glyph so it has breathing room inside the slot. -->
  <g transform="translate(64 64) scale(0.125) translate(-480 480)">
