<?xml version="1.0" encoding="UTF-8"?>
<!--
  gtaskbar symbolic icon, for the tray and for notifications.

  Same upstream glyph as the application icon: Material Symbols "checklist"
  (outlined, 24px) from https://github.com/google/material-design-icons, under
  the Apache License 2.0. See data/icons/upstream/.

  A symbolic icon is drawn in the canonical grey rather than the upstream
  colour, because GTK remaps the luminance of a `-symbolic` icon to the current
  foreground. That is the same convention adwaita-icon-theme uses.
-->
