name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Build release
        run: cargo build --release --locked

  arch:
    name: Build on Arch
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      # Container jobs do not get a working directory checkout for free, so this
      # has to be explicit.
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm \
            gtk4 \
            libadwaita \
            glib2 \
            cairo \
            pango \
            base-devel \
            git

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: arch

      - name: Test and build
        run: |
          cargo test --locked
          cargo build --release --locked

  minimums:
    name: Build against the documented minimums
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the oldest supported GTK and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libglib2.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: minimums

      # Guards the version floors documented in the README. The crate features
      # in Cargo.toml are what enforce these: raising one above what the app
      # needs makes the build fail here, on the oldest supported distro, rather
      # than silently for every user on that distro.
      - name: Report the GTK and libadwaita versions found
        run: |
          echo "gtk4:         $(pkg-config --modversion gtk4)"
          echo "libadwaita-1: $(pkg-config --modversion libadwaita-1)"

      - name: Build
        run: cargo build --locked

